name: bench
on: [push, pull_request]
jobs:
  harness-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e .
      - name: harness self-check (mock backend)
        run: python -m rigor_eval.run --backend mock
